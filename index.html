<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>侵略タワーバトル｜領域重力版</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101827;color:#f5f7fa;font-family:system-ui,sans-serif}body{overscroll-behavior:none}main{--board-width:min(100%,calc((100dvh - 150px)*.5625));max-width:440px;min-height:100dvh;margin:auto;padding:8px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.side{width:var(--board-width);display:flex;gap:8px;padding:3px;border-radius:12px}.side.top{transform:rotate(180deg);background:#fc8d8722}.side.bottom{background:#73d6ec22}.side.winner{outline:3px solid #f6c65e;box-shadow:0 0 18px #f6c65e88}.side button:first-child{flex:1}.side button:last-child{min-width:100px;background:#cbd6e6;font-size:13px}canvas{display:block;width:var(--board-width);height:auto;aspect-ratio:360/640;background:#1b2638;border-radius:12px;touch-action:none}button{border:0;border-radius:12px;background:#f6c65e;color:#192334;font:700 16px system-ui,sans-serif;padding:10px;min-height:48px}button:disabled{opacity:.45}#status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}#intro{position:fixed;inset:0;background:#101827ed;display:grid;place-items:center;z-index:2}#intro[hidden]{display:none}.intro-card{width:min(90vw,390px);display:grid;gap:8px}.intro-face{text-align:center}.intro-face.top{transform:rotate(180deg)}h1{font-size:24px;margin:0 0 6px}.intro-face button{width:100%;max-width:180px}
  .side.bottom,.side.top{flex-direction:row-reverse}.side{container-type:inline-size}.side button{white-space:nowrap;padding-inline:4px}.side button:first-child{font-size:clamp(17px,8.5cqw,26px)}.side button:last-child{flex:0 0 42%;min-width:0;font-size:clamp(14px,6.5cqw,21px)}.side button.no-place{background:#ffe3bc;color:#a34200;font-weight:900;box-shadow:inset 0 0 0 3px #c75b0a}h1{font-size:clamp(26px,9vw,38px);white-space:nowrap}.intro-face button{font-size:clamp(18px,5.5vw,24px)}.intro-face p{margin:0 0 8px;font-weight:700}.music-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;width:min(100%,256px);margin-inline:auto}.intro-face .music-buttons button{width:100%;max-width:none;min-width:0;min-height:44px;padding:6px 3px;font-size:18px;background:#344257;color:#dce5f1}.intro-face .music-buttons button[aria-checked="true"]{background:#f6c65e;color:#192334}.voice-toggle{display:flex;align-items:center;justify-content:center;gap:8px;width:min(100%,256px);margin:6px auto;color:#f5f7fa;font-weight:700}.voice-toggle input{width:20px;height:20px;accent-color:#f6c65e}.intro-face .start{width:min(100%,256px);max-width:none;min-height:44px;padding:6px;font-size:18px}main,main *,#intro,#intro *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}.startup-error{margin:12px 0 0;color:#ff9ca4;font-size:13px;overflow-wrap:anywhere}
</style>
</head>
<body><main>
<div class="side top" id="top-side"><button id="drop-top">置く</button><button id="restart-top">やり直す</button></div>
<canvas id="board" width="360" height="640" aria-label="上下から積む対戦盤"></canvas>
<div class="side bottom" id="bottom-side"><button id="drop-bottom">置く</button><button id="restart-bottom">やり直す</button></div>
<div id="status" aria-live="polite"></div>
</main>
<div id="intro" role="dialog" aria-modal="true" aria-label="侵略タワーバトル">
  <div class="intro-card">
    <div class="intro-face top"><h1>侵略タワーバトル</h1><div class="music-buttons" role="radiogroup" aria-label="BGM"><button type="button" class="bgm-choice" role="radio" aria-checked="true" data-bgm="213">ブギー</button><button type="button" class="bgm-choice" role="radio" aria-checked="false" data-bgm="211">ジャズ</button><button type="button" class="bgm-choice" role="radio" aria-checked="false" data-bgm="200">ロック</button><button type="button" class="bgm-choice" role="radio" aria-checked="false" data-bgm="mute">BGMなし</button></div><label class="voice-toggle"><input class="voice-enabled" type="checkbox" checked>侵略ボイス</label><button class="start">開始</button><p class="startup-error" hidden></p></div>
    <div class="intro-face bottom"><h1>侵略タワーバトル</h1><div class="music-buttons" role="radiogroup" aria-label="BGM"><button type="button" class="bgm-choice" role="radio" aria-checked="true" data-bgm="213">ブギー</button><button type="button" class="bgm-choice" role="radio" aria-checked="false" data-bgm="211">ジャズ</button><button type="button" class="bgm-choice" role="radio" aria-checked="false" data-bgm="200">ロック</button><button type="button" class="bgm-choice" role="radio" aria-checked="false" data-bgm="mute">BGMなし</button></div><label class="voice-toggle"><input class="voice-enabled" type="checkbox" checked>侵略ボイス</label><button class="start">開始</button><p class="startup-error" hidden></p></div>
  </div>

<script>
window.addEventListener('error',event=>{
  if(document.querySelector('#intro').dataset.gameReady==='true')return;
  // 拡張機能やブラウザが注入したスクリプトの詳細不明エラーではゲームを止めない。
  if(!event.error&&event.message==='Script error.')return;
  if(document.querySelector('#intro').hidden)return;
  const message=(event.error&&event.error.message)||event.message||'不明なエラー';
  document.querySelectorAll('.startup-error').forEach(el=>{el.hidden=false;el.textContent=`起動エラー: ${message}`});
  document.querySelector('#intro').hidden=false;
});
</script>

<script>
(()=>{
  const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d');
  const statusEl=document.querySelector('#status'),introEl=document.querySelector('#intro');
  const dropBtns=[document.querySelector('#drop-top'),document.querySelector('#drop-bottom')];
  const restartBtns=[document.querySelector('#restart-top'),document.querySelector('#restart-bottom')];
  const sides=[document.querySelector('#top-side'),document.querySelector('#bottom-side')];
  if(!window.Matter){
    statusEl.textContent='物理エンジンを読み込めません。';
    document.querySelectorAll('.startup-error').forEach(el=>{el.hidden=false;el.textContent='物理エンジンを読み込めません。'});
    document.querySelectorAll('.start').forEach(b=>b.disabled=true);
    dropBtns.forEach(b=>b.disabled=true);return;
  }
  const {Engine,Bodies,Body,Composite,Events,Query}=Matter;
  const W=360,H=640,BASE_X=180,BASE_W=200,BASE_H=12,TOP_Y=134,BOTTOM_Y=506,BW=80,BH=42,RECT_W=68,STEP=1000/60,INVASION_MS=3500,INVASION_VOLUME=.3,DEFEAT_VOLUME=.4,BGM_VOLUME=1;
  const colors=['#fc8d87','#73d6ec'];
  const shapeNames={rect:'長方形',trapezoid:'台形',triangle:'三角形'};
  const shapeKeys=Object.keys(shapeNames);
  const bgmFiles={'211':'bgm-211-v2.wav','200':'bgm-200-v2.wav','213':'bgm-213-v2.wav'};
  const INVASION_EFFECTS_ENABLED=true;
  const invasionVoiceData=document.querySelector('#invasion-voice-data').textContent.trim();
  const invasionVoiceUrl='data:audio/wav;base64,'+invasionVoiceData;
  const defeatSoundData=document.querySelector('#defeat-sound-data').textContent.trim();
  const defeatSoundUrl='data:audio/wav;base64,'+defeatSoundData;
  let audioContext=null,invasionVoiceBuffer=null,defeatSoundBuffer=null,bgmAudio=null,selectedBgm='213',voiceEnabled=true;
  let engine,blocks,player,firstPlayer=1,phase,aimX,placedAt,lastTime,lag,contactSeen,contactThisTurn,dragPointer,currentShape,lastSecondShape,restartVotes,winner,noPlace,invaded,invasionFx;
  function startBgm(){
    try{
      if(!selectedBgm||selectedBgm==='mute')return;
      if(!bgmAudio){
        bgmAudio=new Audio(bgmFiles[selectedBgm]);
        bgmAudio.loop=true;bgmAudio.volume=BGM_VOLUME;
      }
      bgmAudio.volume=BGM_VOLUME;
      // 読み込み前の音声でcurrentTimeを変更すると、端末によっては再生に進めない。
      if(bgmAudio.readyState>0)bgmAudio.currentTime=0;
      bgmAudio.play().catch(error=>console.warn('BGMを再生できませんでした。',error));
    }catch(error){console.warn('BGMを準備できませんでした。',error)}
  }
  function stopBgm(){
    if(!bgmAudio)return;
    bgmAudio.pause();
    if(bgmAudio.readyState>0)bgmAudio.currentTime=0;
  }
  function prepareGameAudio(){
    const AudioContextClass=window.AudioContext||window.webkitAudioContext;
    if(!AudioContextClass||audioContext)return;
    try{
      audioContext=new AudioContextClass();
      audioContext.resume().catch(error=>console.warn('音声を開始できませんでした。',error));
      if(INVASION_EFFECTS_ENABLED&&voiceEnabled){
        const bytes=Uint8Array.from(atob(invasionVoiceData),char=>char.charCodeAt(0));
        audioContext.decodeAudioData(bytes.buffer).then(buffer=>{invasionVoiceBuffer=buffer}).catch(error=>console.warn('音声を読み込めませんでした。',error));
      }
      const defeatBytes=Uint8Array.from(atob(defeatSoundData),char=>char.charCodeAt(0));
      audioContext.decodeAudioData(defeatBytes.buffer).then(buffer=>{defeatSoundBuffer=buffer}).catch(error=>console.warn('決着音を読み込めませんでした。',error));
    }catch(error){console.warn('音声を準備できませんでした。',error);audioContext=null}
  }
  function playClip(buffer,url,volume,name){
    if(audioContext&&buffer){
      audioContext.resume().then(()=>{
        const source=audioContext.createBufferSource();
        const gain=audioContext.createGain();gain.gain.value=volume;
        source.buffer=buffer;source.connect(gain);gain.connect(audioContext.destination);source.start();
      }).catch(error=>console.warn(`${name}を再生できませんでした。`,error));
      return;
    }
    try{
      const clip=new Audio(url);clip.volume=volume;
      clip.play().catch(error=>console.warn(`${name}を再生できませんでした。`,error));
    }catch(error){console.warn(`${name}を再生できませんでした。`,error)}
  }
  function playInvasionVoice(){
    if(!voiceEnabled)return;
    playClip(invasionVoiceBuffer,invasionVoiceUrl,INVASION_VOLUME,'侵略ボイス');
  }
  function playDefeatSound(){playClip(defeatSoundBuffer,defeatSoundUrl,DEFEAT_VOLUME,'決着音')}
  function makeBody(shape,x,y,owner){
    const opts={density:.0016,friction:.85,frictionStatic:1.2,restitution:0,frictionAir:.09};
    let body;
    if(shape==='trapezoid')body=Bodies.trapezoid(x,y,BW,BH,.38,opts);
    else if(shape==='triangle'){
      const halfSide=BH/Math.sqrt(3);
      body=Bodies.fromVertices(x,y,[[{x:-halfSide,y:BH/2},{x:halfSide,y:BH/2},{x:0,y:-BH/2}]],opts);
    }
    else body=Bodies.rectangle(x,y,RECT_W,BH,opts);
    if(owner===0)Body.setAngle(body,Math.PI);
    return body;
  }
  function addBlock(owner,x,y,shape){
    const body=makeBody(shape,x,y,owner);
    body.owner=owner;body.shape=shape;Composite.add(engine.world,body);blocks.push(body);return body;
  }
  function reset(showIntro=false){
    if(!showIntro)firstPlayer=1-firstPlayer;
    engine=Engine.create({gravity:{x:0,y:0,scale:.001},positionIterations:10,velocityIterations:10});
    blocks=[];player=firstPlayer;phase=showIntro?'intro':'aim';aimX=180;contactSeen=false;contactThisTurn=false;placedAt=0;lastTime=performance.now();lag=0;dragPointer=null;currentShape='rect';lastSecondShape=null;restartVotes=[false,false];winner=null;noPlace=false;invaded=[false,false];invasionFx=[];
    introEl.hidden=!showIntro;
    Composite.add(engine.world,[
      Bodies.rectangle(BASE_X,TOP_Y,BASE_W,BASE_H,{isStatic:true,friction:1.2}),
      Bodies.rectangle(BASE_X,BOTTOM_Y,BASE_W,BASE_H,{isStatic:true,friction:1.2})
    ]);
    // 土台の内側から中央線まで180px = 高さ42pxのブロック4個分 + 12px。
    lastTime=performance.now();lag=0;
    const recordContact=event=>{
      for(const pair of event.pairs){
        if(pair.bodyA.owner!==undefined&&pair.bodyB.owner!==undefined&&pair.bodyA.owner!==pair.bodyB.owner){
          contactSeen=true;contactThisTurn=true;
        }
      }
    };
    Events.on(engine,'collisionStart',recordContact);
    Events.on(engine,'collisionActive',recordContact);
    updateUi();
    if(!showIntro)startBgm();
  }
  function updateUi(message){
    statusEl.textContent=message|| (phase==='aim'?`${player===firstPlayer?'先攻':'後攻'}の番。形は${shapeNames[currentShape]}。`:phase==='end'?'対戦終了。':'開始待ち。');
    for(let owner=0;owner<2;owner++){
      const active=phase==='aim'&&player===owner;
      dropBtns[owner].textContent=active&&noPlace?'置けない':'置く';
      dropBtns[owner].classList.toggle('no-place',active&&noPlace);
      dropBtns[owner].disabled=!active||(!noPlace&&!placementAt(aimX,owner).valid);
      restartBtns[owner].disabled=false;
      restartBtns[owner].textContent=restartVotes[owner]?'同意待ち':'やり直す';
      sides[owner].classList.toggle('winner',phase==='end'&&winner===owner);
    }
  }
  function verticalCollisionInterval(preview,obstacle){
    // 両方の多角形の辺を軸に投影し、縦に動かした時に形が重なる高さを求める。
    if(preview.bounds.max.x<=obstacle.bounds.min.x||preview.bounds.min.x>=obstacle.bounds.max.x)return null;
    let low=-Infinity,high=Infinity;
    for(const vertices of [preview.vertices,obstacle.vertices]){
      for(let i=0;i<vertices.length;i++){
        const a=vertices[i],b=vertices[(i+1)%vertices.length],nx=a.y-b.y,ny=b.x-a.x;
        const project=points=>{
          let min=Infinity,max=-Infinity;
          for(const point of points){const value=point.x*nx+point.y*ny;min=Math.min(min,value);max=Math.max(max,value)}
          return {min,max};
        };
        const p=project(preview.vertices),o=project(obstacle.vertices);
        if(Math.abs(ny)<1e-9){if(p.max<o.min||o.max<p.min)return null;continue}
        const from=(o.min-p.max)/ny,to=(o.max-p.min)/ny;
        low=Math.max(low,Math.min(from,to));high=Math.min(high,Math.max(from,to));
        if(low>high)return null;
      }
    }
    return {low,high};
  }
  function spawnY(preview,owner){
    // 選んだ横位置で、中央線に最も近い自分のブロックの中央線側に置く。
    const baseY=owner===0
      ?TOP_Y+BASE_H/2+1-preview.bounds.min.y
      :BOTTOM_Y-BASE_H/2-1-preview.bounds.max.y;
    let nearest=null;
    for(const block of blocks){
      if(block.owner!==owner)continue;
      const overlap=verticalCollisionInterval(preview,block);
      if(!overlap)continue;
      const distance=block.bounds.min.y<=H/2&&block.bounds.max.y>=H/2
        ?0:Math.min(Math.abs(block.bounds.min.y-H/2),Math.abs(block.bounds.max.y-H/2));
      if(!nearest||distance<nearest.distance)nearest={block,overlap,distance};
    }
    if(!nearest)return baseY;
    // 中央線より上のブロックなら下側へ、下のブロックなら上側へ。
    return nearest.block.position.y<H/2?nearest.overlap.high+1:nearest.overlap.low-1;
  }
  function guideLength(x,fromY,direction){
    let length=Math.min(58,direction<0?fromY-15:H-15-fromY);
    const obstacles=blocks.map(block=>block.vertices);
    for(const y of [TOP_Y,BOTTOM_Y]){
      if(x>=BASE_X-BASE_W/2&&x<=BASE_X+BASE_W/2){
        const left=BASE_X-BASE_W/2,right=BASE_X+BASE_W/2,top=y-BASE_H/2,bottom=y+BASE_H/2;
        obstacles.push([{x:left,y:top},{x:right,y:top},{x:right,y:bottom},{x:left,y:bottom}]);
      }
    }
    for(const vertices of obstacles){
      const ys=[];
      for(let i=0;i<vertices.length;i++){
        const a=vertices[i],b=vertices[(i+1)%vertices.length];
        if(x<Math.min(a.x,b.x)||x>Math.max(a.x,b.x))continue;
        if(Math.abs(a.x-b.x)<1e-9)ys.push(a.y,b.y);
        else ys.push(a.y+(b.y-a.y)*(x-a.x)/(b.x-a.x));
      }
      if(!ys.length)continue;
      const near=Math.min(...ys),far=Math.max(...ys);
      const distance=fromY>=near&&fromY<=far?0:(direction<0?far:near)-fromY;
      if(distance*direction>=0)length=Math.min(length,distance*direction-4);
    }
    return Math.max(0,length);
  }
  function stepPhysics(){
    for(const b of blocks){
      const direction=b.position.y<H/2?-1:1;
      Body.applyForce(b,b.position,{x:0,y:direction*b.mass*.00065});
    }
    Engine.update(engine,STEP);
  }
  function placementAt(x,owner){
    const preview=makeBody(currentShape,x,0,owner),y=spawnY(preview,owner);
    Body.setPosition(preview,{x,y});
    const inside=preview.bounds.min.x>=0&&preview.bounds.max.x<=W&&preview.bounds.min.y>=0&&preview.bounds.max.y<=H;
    return {y,valid:inside&&Query.collides(preview,blocks).length===0};
  }
  function horizontalRange(owner){
    const preview=makeBody(currentShape,0,0,owner);
    return {start:2-preview.bounds.min.x,end:W-2-preview.bounds.max.x};
  }
  function hasLegalPlacement(owner){
    const {start,end}=horizontalRange(owner);
    for(let x=start;x<=end;x+=1)if(placementAt(x,owner).valid)return true;
    return placementAt(end,owner).valid;
  }
  function loseCondition(){
    for(const b of blocks){
      if(b.bounds.max.x<0||b.bounds.min.x>W||b.bounds.min.y<=0||b.bounds.max.y>=H)return b.owner;
    }
    return null;
  }
  function sideName(owner){return `${owner===firstPlayer?'先攻':'後攻'}（${owner===1?'下・青':'上・赤'}）`}
  function finish(loser,reason='落ちた'){
    phase='end';winner=1-loser;
    stopBgm();playDefeatSound();
    updateUi(`${sideName(loser)}は${reason}。${sideName(winner)}の勝ち！`);
  }
  function settle(now){
    if(phase!=='fall')return;
    const elapsed=now-placedAt;
    const calm=blocks.every(b=>Math.hypot(b.velocity.x,b.velocity.y)<.9&&Math.abs(b.angularVelocity)<.05);
    if(elapsed<550||!calm)return;
    for(const b of blocks){Body.setVelocity(b,{x:0,y:0});Body.setAngularVelocity(b,0)}
    player=1-player;
    if(player!==firstPlayer){currentShape=shapeKeys[Math.floor(Math.random()*shapeKeys.length)];lastSecondShape=currentShape}
    else currentShape=lastSecondShape;
    aimX=BASE_X;noPlace=!hasLegalPlacement(player);phase='aim';updateUi();
  }
  function moveAim(event){
    if(phase!=='aim')return;
    const rect=canvas.getBoundingClientRect(),{start,end}=horizontalRange(player);
    aimX=Math.max(start,Math.min(end,(event.clientX-rect.left)*W/rect.width));
    updateUi();
  }
  canvas.addEventListener('pointerdown',event=>{
    event.preventDefault();
    if(phase!=='aim'||dragPointer!==null)return;
    dragPointer=event.pointerId;canvas.setPointerCapture(event.pointerId);moveAim(event);
  });
  canvas.addEventListener('pointermove',event=>{if(event.pointerId===dragPointer)moveAim(event)});
  function stopDrag(event){if(event.pointerId!==dragPointer)return;dragPointer=null;if(canvas.hasPointerCapture(event.pointerId))canvas.releasePointerCapture(event.pointerId)}
  canvas.addEventListener('pointerup',stopDrag);
  canvas.addEventListener('pointercancel',stopDrag);
  canvas.addEventListener('contextmenu',event=>event.preventDefault());
  dropBtns.forEach((button,owner)=>button.addEventListener('click',()=>{
    if(phase!=='aim'||player!==owner)return;
    if(noPlace){finish(player,'置けなかった');return}
    const placement=placementAt(aimX,player);
    if(!placement.valid){updateUi('ここは物が重なります。別の横位置を選んでください。');return}
    const ownCount=blocks.filter(b=>b.owner===player).length;
    const block=addBlock(player,aimX,placement.y,currentShape);
    if(ownCount<3)Body.setVelocity(block,{x:0,y:block.position.y<H/2?-8:8});
    if(INVASION_EFFECTS_ENABLED&&!invaded[player]&&(player===0?block.position.y>=H/2:block.position.y<H/2)){
      invaded[player]=true;
      invasionFx.push({owner:player,at:performance.now()});
      playInvasionVoice();
    }
    contactThisTurn=false;phase='fall';placedAt=performance.now();updateUi('塔の動きを見ています。');
  }));
  restartBtns.forEach((button,owner)=>button.addEventListener('click',()=>{
    restartVotes[owner]=!restartVotes[owner];
    if(restartVotes.every(Boolean))reset(false);else updateUi();
  }));
  document.querySelectorAll('.bgm-choice').forEach(button=>button.addEventListener('click',()=>{
    if(phase!=='intro')return;
    selectedBgm=button.dataset.bgm;
    document.querySelectorAll('.bgm-choice').forEach(choice=>choice.setAttribute('aria-checked',String(choice.dataset.bgm===selectedBgm)));
  }));
  document.querySelectorAll('.voice-enabled').forEach(input=>input.addEventListener('change',()=>{
    if(phase!=='intro')return;
    voiceEnabled=input.checked;
    document.querySelectorAll('.voice-enabled').forEach(choice=>{choice.checked=voiceEnabled});
  }));
  document.querySelectorAll('.start').forEach(button=>button.addEventListener('click',()=>{
    if(phase!=='intro')return;
    startBgm();
    prepareGameAudio();
    introEl.hidden=true;phase='aim';updateUi();
  }));
  document.addEventListener('pointerdown',()=>{
    if((phase==='aim'||phase==='fall')&&bgmAudio&&bgmAudio.paused){
      bgmAudio.play().catch(error=>console.warn('BGMを再試行できませんでした。',error));
    }
  },{passive:true});
  function draw(now){
    ctx.fillStyle='#1b2638';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#233748';ctx.fillRect(0,0,W,H/2);ctx.fillStyle='#282b42';ctx.fillRect(0,H/2,W,H/2);
    ctx.strokeStyle='#66738c';ctx.setLineDash([4,7]);ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();ctx.setLineDash([]);
    for(const y of [TOP_Y,BOTTOM_Y]){ctx.fillStyle='#d7dbe5';ctx.fillRect(BASE_X-BASE_W/2,y-BASE_H/2,BASE_W,BASE_H)}
    function paint(body,color,alpha=1){
      ctx.globalAlpha=alpha;ctx.beginPath();
      body.vertices.forEach((v,i)=>i?ctx.lineTo(v.x,v.y):ctx.moveTo(v.x,v.y));
      ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#142031';ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;
    }
    for(const b of blocks)paint(b,colors[b.owner]);
    if(phase==='end'&&winner!==null){
      ctx.font='bold 40px system-ui,sans-serif';ctx.textAlign='center';
      for(let owner=0;owner<2;owner++){
        ctx.save();ctx.translate(W/2,owner===0?54:H-48);
        if(owner===0)ctx.rotate(Math.PI);
        ctx.fillStyle=owner===winner?'#ffdb73':'#f5f7fa';
        ctx.fillText(owner===winner?'勝利！':'あっ！',0,0);
        ctx.restore();
      }
    }
    if(phase==='aim'){
      const placement=placementAt(aimX,player),color=placement.valid?colors[player]:'#ff5964';
      const preview=makeBody(currentShape,aimX,placement.y,player);
      const blink=placement.valid?1:.5+.5*Math.cos(now*Math.PI/650);
      paint(preview,color,placement.valid ? .72 : .25+.6*blink);
      const direction=placement.y<H/2?-1:1;
      const fromY=direction<0?preview.bounds.min.y:preview.bounds.max.y;
      const length=guideLength(aimX,fromY,direction);
      if(length>=8){
        const endY=fromY+direction*length;
        ctx.save();ctx.globalAlpha=placement.valid?1:.4+.6*blink;
        ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=3.5;
        ctx.shadowColor=color;ctx.shadowBlur=9;
        if(length>=19){
          ctx.setLineDash([9,6]);ctx.beginPath();ctx.moveTo(aimX,fromY+direction*3);ctx.lineTo(aimX,endY-direction*8);ctx.stroke();ctx.setLineDash([]);
        }
        const wing=Math.min(8,length*.38),arrowHeight=Math.min(12,length*.55);
        ctx.beginPath();ctx.moveTo(aimX,endY);ctx.lineTo(aimX-wing,endY-direction*arrowHeight);ctx.lineTo(aimX+wing,endY-direction*arrowHeight);ctx.closePath();ctx.fill();
        ctx.restore();
      }
    }
    invasionFx=invasionFx.filter(fx=>now-fx.at<INVASION_MS);
    for(const fx of invasionFx){
      const progress=Math.max(0,(now-fx.at)/INVASION_MS),rush=progress*progress*progress,scale=1.15+1.05*rush;
      ctx.save();ctx.translate(W/2,fx.owner===0?H/2-72:H/2+72);
      if(fx.owner===0)ctx.rotate(Math.PI);
      ctx.scale(scale,scale);ctx.globalAlpha=1-rush;
      ctx.font='900 38px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.lineWidth=5;ctx.strokeStyle='#142031';ctx.strokeText('侵略ッ！',0,0);
      ctx.fillStyle=colors[fx.owner];ctx.fillText('侵略ッ！',0,0);
      ctx.restore();
    }
  }
  function frame(now){
    lag+=Math.min(50,now-lastTime);lastTime=now;
    if(phase==='fall'){
      let loser=null;
      while(lag>=STEP&&loser===null){stepPhysics();lag-=STEP;loser=loseCondition()}
      if(loser!==null)finish(loser);else settle(now);
    }else lag=0;
    draw(now);requestAnimationFrame(frame);
  }
  reset(true);requestAnimationFrame(frame);
  introEl.dataset.gameReady='true';
  document.querySelectorAll('.startup-error').forEach(el=>{el.hidden=true;el.textContent=''});
})();
</script>
</body></html>
